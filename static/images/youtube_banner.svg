<svg width="2048" height="1152" viewBox="0 0 2048 1152" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background matching the blog's theme -->
  <rect width="2048" height="1152" fill="#1e293b"/>

  <defs>
    <!-- Gradient for "shiny" green candles -->
    <linearGradient id="greenCandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e; stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#16a34a; stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for "shiny" red candles -->
    <linearGradient id="redCandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444; stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#dc2626; stop-opacity:1" />
    </linearGradient>
    <!-- Metallic gradient for coins -->
    <radialGradient id="goldCoin">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
    <!-- Pattern for the candlestick background -->
    <pattern id="candlestickPattern" patternUnits="userSpaceOnUse" width="120" height="120" x="0" y="0">
      <g opacity="0.1">
        <!-- Green Candle -->
        <rect x="10" y="20" width="20" height="50" fill="url(#greenCandle)" />
        <line x1="20" y1="10" x2="20" y2="70" stroke="#16a34a" stroke-width="3" />
        <!-- Red Candle -->
        <rect x="70" y="40" width="20" height="40" fill="url(#redCandle)" />
        <line x1="80" y1="30" x2="80" y2="90" stroke="#dc2626" stroke-width="3" />
      </g>
    </pattern>
    <!-- Filter for the glowing stock path -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="7.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Apply the candlestick pattern as a base texture -->
  <rect width="2048" height="1152" fill="url(#candlestickPattern)" />

  <!-- Scattered currency coins in the background -->
  <g opacity="0.2" font-family="serif" font-size="40" font-weight="bold" fill="url(#goldCoin)" text-anchor="middle">
    <text x="200" y="300">€</text>
    <text x="1800" y="400">$</text>
    <text x="450" y="900">£</text>
    <text x="1500" y="850">¥</text>
    <text x="1900" y="100">$</text>
    <text x="100" y="1000">€</text>
  </g>

  <!-- Sample stock price process path -->
  <path d="M 0 800 Q 150 750, 300 850 T 600 750 Q 750 700, 900 800 T 1200 700 Q 1350 650, 1500 550 T 1800 450 Q 1950 400, 2048 300"
        fill="none" stroke="#60a5fa" stroke-width="8" filter="url(#glow)" opacity="0.6"/>

  <!-- Centered content for the safe area -->
  <g transform="translate(0, 400)">
    <!-- Logo -->
    <g transform="translate(580, -60) scale(1.2)">
        <rect width="100" height="100" rx="15" fill="#101827"/>
        <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-family="sans-serif" font-size="70" font-weight="600" fill="#60a5fa">Q</text>
    </g>

    <!-- Main Channel Title -->
    <text x="1024" y="50" dominant-baseline="central" text-anchor="middle" font-family="sans-serif" font-size="90" font-weight="bold" fill="#f8fafc" stroke="#1e293b" stroke-width="2" stroke-linejoin="round">
      Quant at Risk
    </text>

    <!-- Subtitle / Tagline -->
    <text x="1024" y="150" dominant-baseline="central" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#cbd5e1" letter-spacing="1.5">
      Stochastic Processes • Mathematical Finance • Quantitative Risk Modeling
    </text>
  </g>
</svg>
