<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- A dark, rounded square background similar to GitHub's style -->
  <rect width="100" height="100" rx="15" fill="#2d3748"/>

  <!-- The letter 'Q' in a single, bright color for high contrast -->
  <text
    x="50%"
    y="50%"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="sans-serif"
    font-size="70"
    font-weight="600"
    fill="#60a5fa">
    Q
  </text>
</svg>
