name: Generate DOI
on:
  push:
    paths: ['content/posts/**']
jobs:
  doi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Generate DOIs
      run: |
        cd content/posts
        for post in *.md; do
          # Only process files that do NOT already have a DOI
          if ! grep -q "^doi:" "$post"; then
            echo "Generating DOI for $post"
            post_date=$(grep -oP 'date: \K[^#]+' "$post" | xargs)
            date_fmt=$(date -d "$post_date" +%Y%m%d)
            slug=$(basename "$post" .md)
            doi="10.yourblog${date_fmt}${RANDOM:0:3}"
            # Insert the new DOI right after the '---'
            sed -i "/^---/a doi: $doi" "$post"
          fi
        done

    - uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-generate DOIs"