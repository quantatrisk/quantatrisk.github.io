name: Generate DOI
on:
  push:
    paths: ['content/posts/**']
jobs:
  doi:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Generate DOIs
      run: |
        cd content/posts
        for post in *.md; do
          # Extract the date, remove comments, and trim whitespace
          post_date=$(grep -oP 'date: \K[^#]+' "$post" | xargs)
          date_fmt=$(date -d "$post_date" +%Y%m%d)
          slug=$(basename "$post" .md)
          doi="10.yourblog${date_fmt}${RANDOM:0:3}"
          # Use sed to append the DOI to avoid duplicates
          sed -i "/^---/a doi: $doi" "$post"
        done

    - uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-generate DOIs"