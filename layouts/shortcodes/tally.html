{{/*
  Tally.so Shortcode for Hugo (Modern Version)
  Usage: {{< tally id="BzG8RR" title="Contact Me" >}}
*/}}

{{- $id := .Get "id" -}}
{{- $title := .Get "title" | default "Tally Form" -}}

<iframe
  data-tally-src="https://tally.so/embed/{{ $id }}?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
  loading="lazy"
  width="100%"
  height="100" {{/* Initial height, Tally's script will resize it */}}
  frameborder="0"
  marginheight="0"
  marginwidth="0"
  title="{{ $title }}">
</iframe>

{{/* This script is from the standard Tally embed and should be included. */}}
<script>
  var d = document,
    w = "https://tally.so/widgets/embed.js",
    v = function () {
      "undefined" != typeof Tally
        ? Tally.loadEmbeds()
        : d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function (e) {
            e.src = e.dataset.tallySrc;
          });
    };
  if ("undefined" != typeof Tally) v();
  else if (d.querySelector('script[src="' + w + '"]') == null) {
    var s = d.createElement("script");
    s.src = w;
    s.onload = v;
    s.onerror = v;
    d.body.appendChild(s);
  }
</script>
