# https://quantatrisk.github.io/
baseURL: "https://quantatrisk.github.io/"
languageCode: "en-us"
title: "Quant at Risk"
theme: "PaperMod"

# Book-ready pagination
pagination:
  pagerSize: 10
  path: "page"

# Essential features
enableGitInfo: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
hasCJKLanguage: false
defaultContentLanguage: "en"
pluralizeListTitles: false

# Math/LaTeX + Syntax (single markup section)
markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      definitionList: true
  highlight:
    noClasses: false
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: true
    style: "github-dark"
  katex:
    enable: true
    noInlineSVG: false

# PaperMod Params (Homepage + Features)
params:
  env: production
  title: "Quant at Risk"
  description: "Stochastic Processes • Mathematical Finance • Quantitative Risk Modeling"
  keywords: ["stochastic", "finance", "quant", "math", "Bessel", "Brownian"]
  author: "Pinaki Bhattacharyya"
  images: ["/favicon.ico"]
  
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: true
  
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false
  
  # Homepage: Home Info + Latest Posts
  profileMode:
    enabled: false
  homeInfoParams:
    Title: "Welcome to Quant at Risk 👋"
    Content: "Stochastic Processes • Mathematical Finance • Bessel Modeling • Risk Analytics"
    imageUrl: "/favicon.ico"
  
  # Branding (moved under params)
  label:
    text: "Quant"
    icon: "/favicon.ico"
    iconHeight: 35
  
  # Book editing
  editPost:
    URL: "https://github.com/quantatrisk/quantatrisk.github.io/tree/main/content/posts"
    Text: "Edit on GitHub"
    appendFilePath: true
  
  # Search
  fuseOpts:
    isCaseSensitive: false
    threshold: 0.4
    limit: 10
    keys: ["title", "summary", "content"]
  
  assets:
    disableHLJS: false
    favicon: "/favicon.ico"

  # Social
  socialIcons:
    - name: "github"
      url: "https://github.com/quantatrisk"
    - name: "linkedin"
      url: "https://linkedin.com/in/quantatrisk"
    - name: "twitter-x"
      url: "https://twitter.com/quantatrisk"

# Clean analytics/verification
analytics:
  google: ''
verification:
  google: ''

# Main Menu (Book Structure)
menu:
  main:
    - identifier: "posts"
      name: "📚 Posts"
      url: "/posts/"
      weight: 10
    - identifier: "series"
      name: "📖 Book Series"
      url: "/series/"
      weight: 20
    - identifier: "categories"
      name: "🏷️ Categories"
      url: "/categories/"
      weight: 30
    - identifier: "tags"
      name: "🔖 Tags"
      url: "/tags/"
      weight: 40

# Taxonomies (Book organization)
taxonomies:
  category: "categories"
  tag: "tags"
  series: "series"