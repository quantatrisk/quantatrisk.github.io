# https://quantatrisk.github.io/
baseURL: "https://quantatrisk.github.io/"
languageCode: "en-us"
outputFormats:utputs:itle: "Quant at Risk"
outputFormats:utputs:heme: "PaperMod"

# Book-ready pagination
outputFormats:utputs:aginate: 10
outputFormats:utputs:aginatePath: "page"

# Essential features
enableGitInfo: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
hasCJKLanguage: false
defaultContentLanguage: "en"
outputFormats:utputs:luralizeListTitles: false

# Homepage: Home Info + Latest Posts (Book Landing)
params:
  # Disable profile mode (enables home info + posts)
  profileMode:
    enabled: false
  
  # Hero section
  homeInfoParams:
    Title: "Welcome to Quant at Risk 👋"
    Content: "Stochastic Processes • Mathematical Finance • Bessel Modeling • Risk Analytics"
    imageUrl: "/images/quant-hero.jpg"
  
  # Branding
  label:
    text: "Quant"
    icon: "/favicon.ico"
    iconHeight: 35
  
 # Latest posts config
  ShowReadingTime: true
  ShowWordCount: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  UseHugoToc: true


# Math/LaTeX (Katex) + Syntax
outputFormats:arkup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      definitionList: true
  highlight:
    noClasses: false
  katex:
    enable: true
    noInlineSVG: false

# Sitemap & canonical
outputs:
  home: ["HTML", "RSS", "JSON"]
outputFormats:
  disqusSitemap:
    mediatype: "application/xml"
    baseName: "disqus"

# PaperMod Params (All Features)
params:
  env: production
  
  title: "Quant at Risk"
  description: "Stochastic Processes • Mathematical Finance • Quantitative Risk Modeling"
  keywords: ["stochastic", "finance", "quant", "math", "Bessel", "Brownian"]
  author: "PinakiBhattacharyya"
  images: ["/images/quant-og.jpg"]
  
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: true
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false  # Add Disqus/Giscus later
  hidemeta: false
  hideSummary: false
  showtoc: true    # Math posts TOC
  tocopen: false
  
  # Cover images per post
  cover:
    hiddenInList: false
    hiddenInSingle: false
  
  # Book series navigation
  editPost:
    URL: "https://github.com/quantatrisk/quantatrisk.github.io/tree/main/content/posts"
    Text: "Edit on GitHub"
    appendFilePath: true
  
  # Search (math/technical content)
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    limit: 10
    keys: ["title", "permalink", "summary", "content", "tags", "categories"]
  
  # Assets
  assets:
    disableHLJS: false  # Syntax highlighting
    favicon: "/favicon.ico"
  
  # Sidebar label (Quant branding)
  label:
    text: "Quant"
    icon: /favicon.ico
    iconHeight: 35
  
  
  # Social (professional)
  socialIcons:
    - name: "github"
      url: "https://github.com/quantatrisk"
    - name: "linkedin"
      url: "https://linkedin.com/in/quantatrisk"
    - name: "twitter-x"
      url: "https://twitter.com/quantatrisk"

# Analytics (empty: no tracking errors)
analytics:
  google: ''

# SEO Verification (empty)
verification:
  google: ''

# Main Menu (Book Structure)
outputFormats:enu:
  main:
    - identifier: "posts"
      name: "📚 Posts"
      url: "/posts/"
      weight: 10
    - identifier: "series"
      name: "📖 Book Series"
      url: "/series/"
      weight: 20
    - identifier: "categories"
      name: "🏷️ Categories"
      url: "/categories/"
      weight: 30
    - identifier: "tags"
      name: "🔖 Tags"
      url: "/tags/"
      weight: 40

# Syntax highlighting (Chroma - math/code)
markup:
  highlight:
    noClasses: false
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: true
    style: "github-dark"

# Taxonomies (Book organization)
taxonomies:
  category: "categories"
  tag: "tags"
  series: "series"